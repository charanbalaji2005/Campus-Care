# Render blueprint for CampusCare. Secrets use `sync: false` â€” enter them in the dashboard; never commit them.
services:
  - type: web
    name: campuscare-api-gywg
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build -w @campuscare/shared && npm run build -w @campuscare/api
    preDeployCommand: npm run sync-indexes -w @campuscare/api
    startCommand: npm start -w @campuscare/api
    healthCheckPath: /api/v1/health
    disk:
      name: campuscare-files
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: RUN_WORKER
        value: "true"
      - key: STORAGE_DIR
        value: /var/data/private
      - key: EMAIL_PROVIDER
        value: nodemailer
      - key: MAIL_SERVICE
        value: gmail
      - key: WEB_ORIGIN
        value: https://campuscare-web.onrender.com
      - key: API_PUBLIC_URL
        value: https://campuscare-api-gywg.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: ANONYMITY_KEY
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      - key: TURNSTILE_EXPECTED_HOSTNAMES
        value: campuscare-web.onrender.com,campuscare-api-gywg.onrender.com
      - key: MAIL_USER
        sync: false
      - key: MAIL_APP_PASSWORD
        sync: false

  - type: web
    name: campuscare-web
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build -w @campuscare/shared && npm run build -w @campuscare/web
    startCommand: npm start -w @campuscare/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: API_ORIGIN
        value: https://campuscare-api-gywg.onrender.com
      - key: NEXT_PUBLIC_REALTIME_URL
        value: https://campuscare-api-gywg.onrender.com
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false